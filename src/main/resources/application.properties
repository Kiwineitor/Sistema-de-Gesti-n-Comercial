spring.application.name=pedidosCori

# Conexion a PostgreSQL (en Docker la inyecta docker-compose; en Railway las variables PG*)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ekwe_iyawe}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=${PORT:8080}

admin.pin=${ADMIN_PIN:1234}
admin.session-minutes=60

# Usuarios iniciales (se crean solo si no existen en la BD)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.mesero-password=${SEED_MESERO_PASSWORD:mesero123}
app.seed.cocina-password=${SEED_COCINA_PASSWORD:cocina123}
# Carga un menu de ejemplo si la tabla de platos esta vacia
app.seed.demo-data=${SEED_DEMO_DATA:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=3600
