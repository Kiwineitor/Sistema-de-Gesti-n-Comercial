spring.application.name=pedidosCori

# Conexion a PostgreSQL (en Docker la inyecta docker-compose; en Railway las variables PG*)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ekwe_iyawe}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

server.port=${PORT:8080}

# Usuarios iniciales (se crean solo si no existen en la BD)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.mesero-password=${SEED_MESERO_PASSWORD:}
app.seed.cocina-password=${SEED_COCINA_PASSWORD:}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}
# Detrás de un proxy inverso de confianza, configurar server.forward-headers-strategy=native.
# El límite de login usa request.getRemoteAddr(); nunca lee X-Forwarded-For directamente.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Carga un menu de ejemplo si la tabla de platos esta vacia
app.seed.demo-data=${SEED_DEMO_DATA:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=3600
