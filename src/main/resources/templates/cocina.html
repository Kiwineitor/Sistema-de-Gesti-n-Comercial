<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${negocio.nombreNegocio} — ${negocio.etiquetaRolCocina}|">Gestión Comercial</title>
    <th:block th:replace="~{fragments/head :: branding}"></th:block>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--surface-page);
        }

        body {
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topnav {
            position: relative;
            z-index: 100;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            padding: 0 18px;
            height: 54px;
            background: var(--header-bg);
            color: var(--header-text);
            border-bottom: 3px solid var(--brand-accent);
            flex-shrink: 0;
            box-shadow: var(--elev-2);
        }

        .nav-logo {
            justify-self: start;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 900;
            font-size: .98rem;
            color: var(--header-text);
        }

        .nav-logo em {
            font-style: normal;
            color: inherit;
        }

        .nav-clock {
            justify-self: center;
            font-weight: 800;
            font-size: 1rem;
            color: var(--header-text);
            letter-spacing: .5px;
            font-variant-numeric: tabular-nums;
        }

        .topnav > .sesion-menu {
            justify-self: end;
        }

        .sbar {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 1px;
            background: var(--border-main);
            border-bottom: 1px solid var(--border-main);
            flex-shrink: 0;
            box-shadow: var(--elev-1);
        }

        .si {
            flex: 1;
            background: var(--surface-card);
            padding: 13px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            box-shadow: var(--edge-top);
        }

        .si::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .si.p::before,
        .si.p .si-dot {
            background: var(--status-warning);
        }

        .si.r::before,
        .si.r .si-dot {
            background: var(--status-info);
        }

        .si.l::before,
        .si.l .si-dot {
            background: var(--status-success);
        }

        .si-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .si-num {
            display: inline-block;
            font-size: 1.9rem;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .si.p .si-num {
            color: var(--status-warning-text);
        }

        .si.r .si-num {
            color: var(--status-info-text);
        }

        .si.l .si-num {
            color: var(--status-success-text);
        }

        .cnt-bump {
            animation: cnt-bump var(--dur-base) var(--ease-out);
        }

        @keyframes cnt-bump {
            from {
                opacity: .4;
                transform: translateY(-3px) scale(1.12);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .si-lbl {
            display: flex;
            flex-direction: column;
        }

        .si-title {
            font-size: .76rem;
            font-weight: 800;
            letter-spacing: .4px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .si-sub {
            font-size: .68rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .kanban {
            flex: 1;
            display: flex;
            gap: 1px;
            overflow: hidden;
            background: var(--border-main);
        }

        .col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--surface-sunken);
            overflow: hidden;
        }

        .col-head {
            position: relative;
            z-index: 1;
            padding: 11px 13px 9px;
            border-bottom: 1px solid;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--edge-top), var(--elev-1);
        }

        .col.cp .col-head {
            background: var(--status-warning-soft);
            color: var(--status-warning-text);
            border-bottom-color: var(--status-warning-border);
        }

        .col.cr .col-head {
            background: var(--status-info-soft);
            color: var(--status-info-text);
            border-bottom-color: var(--status-info-border);
        }

        .col.cl .col-head {
            background: var(--status-success-soft);
            color: var(--status-success-text);
            border-bottom-color: var(--status-success-border);
        }

        .col-title {
            font-size: .74rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .col-cnt {
            display: inline-block;
            font-size: .78rem;
            font-weight: 800;
            border-radius: 6px;
            padding: 2px 8px;
            font-variant-numeric: tabular-nums;
            box-shadow: var(--edge-top), var(--edge-bottom);
        }

        .col.cp .col-cnt {
            background: var(--status-warning);
            color: var(--status-warning-on);
        }

        .col.cr .col-cnt {
            background: var(--status-info);
            color: var(--status-info-on);
        }

        .col.cl .col-cnt {
            background: var(--status-success);
            color: var(--status-success-on);
        }

        .col-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ocard {
            background: var(--surface-card);
            color: var(--text-main);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-main);
            border-top: 4px solid;
            overflow: hidden;
            box-shadow: var(--edge-top), var(--elev-1);
            transition: box-shadow var(--dur-base) var(--ease-out);
            animation: ui-pop-in var(--dur-base) var(--ease-out) both;
            flex-shrink: 0;
        }

        .ocard:hover {
            box-shadow: var(--edge-top), var(--elev-2);
        }

        .ocard.flash {
            animation: ui-pop-in var(--dur-base) var(--ease-out) both, fnew 1s ease var(--dur-base) 3;
        }

        @keyframes fnew {

            0%,
            100% {
                box-shadow: var(--edge-top), var(--elev-1);
            }

            50% {
                box-shadow: var(--edge-top), 0 0 0 3px var(--status-warning-border), var(--elev-2);
            }
        }

        .col.cp .ocard {
            border-top-color: var(--status-warning);
        }

        .col.cr .ocard {
            border-top-color: var(--status-info);
        }

        .col.cl .ocard {
            border-top-color: var(--status-success);
        }

        .ochead {
            padding: 10px 12px 7px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .oc-id {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .oc-mesa {
            font-size: 1rem;
            font-weight: 900;
            color: var(--text-main);
            overflow-wrap: anywhere;
        }

        .oc-tipo {
            font-size: .66rem;
            font-weight: 800;
            letter-spacing: .5px;
            padding: 2px 7px;
            border-radius: 5px;
            border: 1px solid;
        }

        .ct-mesa {
            background: var(--status-warning-soft);
            color: var(--status-warning-text);
            border-color: var(--status-warning-border);
        }

        .ct-ll {
            background: var(--status-info-soft);
            color: var(--status-info-text);
            border-color: var(--status-info-border);
        }

        .oc-timer {
            font-size: .88rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .oc-timer.ok {
            color: var(--text-muted);
        }

        .oc-timer.warn {
            color: var(--status-warning-text);
        }

        .oc-timer.hot {
            color: var(--status-error-text);
            animation: blink .7s ease infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .oc-items {
            padding: 0 12px 9px;
        }

        .oc-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 7px;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-main);
            font-size: .83rem;
            color: var(--text-main);
        }

        .oc-row:last-child {
            border: none;
        }

        .oc-qty {
            font-weight: 900;
            min-width: 22px;
            font-size: .85rem;
        }

        .col.cp .oc-qty {
            color: var(--status-warning-text);
        }

        .col.cr .oc-qty {
            color: var(--status-info-text);
        }

        .col.cl .oc-qty {
            color: var(--status-success-text);
        }

        .oc-name {
            flex: 1;
            font-weight: 700;
            color: var(--text-main);
        }

        .oc-nota {
            font-size: .7rem;
            color: var(--text-muted);
            font-weight: 600;
            font-style: italic;
        }

        .oc-pres {
            display: inline-block;
            font-size: .72rem;
            background: var(--status-info-soft);
            color: var(--status-info-text);
            border: 1px solid var(--status-info-border);
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .oc-nuevo {
            font-size: .66rem;
            font-weight: 900;
            letter-spacing: .4px;
            background: var(--status-success-soft);
            color: var(--status-success-text);
            border: 1px solid var(--status-success-border);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .oc-sopa-row {
            padding: 0 12px 4px 42px;
        }

        .oc-sopa {
            font-size: .72rem;
            font-weight: 800;
            background: var(--status-warning-soft);
            color: var(--status-warning-text);
            border-radius: 5px;
            padding: 2px 7px;
            border: 1px solid var(--status-warning-border);
        }

        .oc-obs {
            margin: 0 12px 9px;
            padding: 7px 9px;
            background: var(--status-warning-soft);
            border-radius: 7px;
            font-size: .74rem;
            color: var(--status-warning-text);
            border-left: 3px solid var(--status-warning);
            font-weight: 700;
        }

        .oc-action {
            padding: 9px 11px 11px;
        }

        .oc-listo {
            text-align: center;
            padding: 6px;
            font-weight: 800;
            font-size: .85rem;
            color: var(--status-success-text);
        }

        .abtn {
            width: 100%;
            margin: 0;
            border: 0;
            border-radius: var(--radius-md);
            padding: 13px;
            font-size: .9rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .abtn:disabled {
            cursor: wait;
        }

        .abtn-prep {
            background: var(--status-info);
            color: var(--status-info-on);
        }

        .abtn-list {
            background: var(--status-success);
            color: var(--status-success-on);
        }

        .col-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: .82rem;
            padding: 30px 10px;
            font-weight: 600;
            animation: ui-fade-in var(--dur-base) ease both;
        }

        .abar {
            position: fixed;
            top: 54px;
            left: 0;
            right: 0;
            z-index: 99;
            padding: 10px 15px;
            background: var(--status-warning-soft);
            color: var(--status-warning-text);
            border-bottom: 2px solid var(--status-warning-border);
            display: flex;
            align-items: center;
            gap: 11px;
            visibility: hidden;
            transform: translateY(-100%);
            transition: transform var(--dur-base) var(--ease-out), visibility 0s linear var(--dur-base);
            box-shadow: var(--elev-2);
        }

        .abar.show {
            visibility: visible;
            transform: translateY(0);
            transition: transform var(--dur-base) var(--ease-out), visibility 0s linear 0s;
        }

        .abar-ico {
            font-size: 1.4rem;
        }

        .abar.show .abar-ico {
            animation: shake .4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0)
            }

            25% {
                transform: rotate(-12deg)
            }

            75% {
                transform: rotate(12deg)
            }
        }

        .abar-txt {
            flex: 1;
            font-weight: 800;
            font-size: .9rem;
            color: var(--status-warning-text);
        }

        .abar-cls {
            margin: 0;
            background: var(--status-warning);
            color: var(--status-warning-on);
            border: 0;
            border-radius: var(--radius-sm);
            padding: 7px 14px;
            font-size: .82rem;
            font-weight: 800;
        }

        @media(max-width:680px) {
            .kanban {
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .col {
                flex: none;
            }

            .col-body {
                max-height: 260px;
            }

            .sbar {
                overflow-x: auto;
            }

            .si-num {
                font-size: 1.5rem;
            }
        }

        @media(max-width:560px) {
            .topnav {
                grid-template-columns: minmax(0, 1fr) auto;
                padding: 0 12px;
            }

            .nav-clock {
                display: none;
            }
        }

        .cocina-page ::-webkit-scrollbar {
            width: 4px;
        }

        .cocina-page ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 2px;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: var(--surface-page);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 13px;
            z-index: 200;
        }

        #loader.hidden {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .ldspin {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-main);
            border-top-color: var(--brand-primary-text);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        .ldtxt {
            font-weight: 700;
            font-size: .88rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body class="cocina-page">
    <div id="loader">
        <div class="ldspin"></div>
        <div class="ldtxt">Cargando pedidos...</div>
    </div>

    <nav class="topnav">
        <a class="nav-logo brand-home" th:href="@{/}" aria-label="Ir al inicio"><em th:text="${negocio.nombreNegocio}">Gestión Comercial</em> — <span th:text="${negocio.etiquetaRolCocina}">Preparación</span></a>
        <div class="nav-clock" id="nav-clock">--:--:--</div>
        <div th:replace="~{fragments/sesion :: barra}"></div>
    </nav>

    <div class="sbar">
        <div class="si p">
            <div class="si-dot"></div>
            <div class="si-num" id="cnt-p">0</div>
            <div class="si-lbl">
                <div class="si-title">Pendientes</div>
                <div class="si-sub">Por atender</div>
            </div>
        </div>
        <div class="si r">
            <div class="si-dot"></div>
            <div class="si-num" id="cnt-r">0</div>
            <div class="si-lbl">
                <div class="si-title">En prep.</div>
                <div class="si-sub">Cocinando</div>
            </div>
        </div>
        <div class="si l">
            <div class="si-dot"></div>
            <div class="si-num" id="cnt-l">0</div>
            <div class="si-lbl">
                <div class="si-title">Listos</div>
                <div class="si-sub">Para entregar</div>
            </div>
        </div>
    </div>

    <div class="abar" id="abar" role="status" aria-live="polite">
        <span class="abar-ico" aria-hidden="true">🔔</span>
        <span class="abar-txt" id="abar-txt">Nuevo pedido</span>
        <button type="button" class="abar-cls" aria-label="Cerrar aviso" onclick="closeAlert()">Cerrar</button>
    </div>

    <div class="kanban">
        <div class="col cp" id="col-P">
            <div class="col-head">
                <span class="col-title">Pendientes</span>
                <span class="col-cnt" id="hcnt-p">0</span>
            </div>
            <div class="col-body" id="body-PENDIENTE">
                <div class="col-empty">Sin pedidos pendientes</div>
            </div>
        </div>
        <div class="col cr" id="col-R">
            <div class="col-head">
                <span class="col-title">En Preparación</span>
                <span class="col-cnt" id="hcnt-r">0</span>
            </div>
            <div class="col-body" id="body-EN_PREPARACION">
                <div class="col-empty">Ninguno en preparación</div>
            </div>
        </div>
        <div class="col cl" id="col-L">
            <div class="col-head">
                <span class="col-title">Listos para entregar</span>
                <span class="col-cnt" id="hcnt-l">0</span>
            </div>
            <div class="col-body" id="body-LISTO">
                <div class="col-empty">Ninguno listo aún</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/security.js" th:src="@{/js/security.js}"></script>
    <script>
        const MARCA = window.NEGOCIO;
        const MESA = MARCA.puntoAtencionSingular;
        const LLEVAR = MARCA.etiquetaParaLlevar;
        const PEDIDOS = {};
        const ESTADOS = { PENDIENTE: 'Pendiente', EN_PREPARACION: 'En preparación', LISTO: 'Listo' };
        let confirmando = false;

        function etiquetaPedido(p) {
            return p.tipo === 'LLEVAR' ? (p.nombreCliente || LLEVAR) : MESA + ' ' + p.numeroMesa;
        }

        async function loadPedidos() {
            try {
                const r = await secureFetch('/api/pedidos/cocina');
                if (!r.ok) throw await apiError(r);
                const list = await r.json();
                const presentes = new Set(list.map(p => String(p.id)));
                Object.keys(PEDIDOS).forEach(id => {
                    if (!presentes.has(id)) quitarPedido(id);
                });
                list.forEach(p => {
                    if (!PEDIDOS[p.id] || JSON.stringify(PEDIDOS[p.id]) !== JSON.stringify(p)
                            || !document.getElementById('oc-' + p.id)) place(p);
                });
                updCounts();
            } catch (e) { console.error('loadPedidos:', e); showNotice(e.message); }
            document.getElementById('loader').classList.add('hidden');
        }

        function tick() {
            document.getElementById('nav-clock').textContent =
                new Date().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }
        tick(); setInterval(tick, 1000);

        setInterval(() => {
            document.querySelectorAll('[data-since]').forEach(el => {
                const diff = Math.floor((Date.now() - parseInt(el.dataset.since)) / 1000);
                const m = String(Math.floor(diff / 60)).padStart(2, '0');
                const s = String(diff % 60).padStart(2, '0');
                el.textContent = m + ':' + s;
                el.className = 'oc-timer ' + (diff > 600 ? 'hot' : diff > 300 ? 'warn' : 'ok');
            });
        }, 1000);

        function agruparDetalles(p) {
            const grupos = new Map();
            (p.detalles || []).forEach(d => {
                const nuevo = (p.ultimoDetallePreparadoId ?? 0) > 0
                    && d.id > p.ultimoDetallePreparadoId;
                const clave = JSON.stringify([
                    d.plato?.id ?? null,
                    d.presentacion?.id ?? null,
                    d.acompananteSopa?.id ?? null,
                    d.notas || '',
                    nuevo
                ]);
                const existente = grupos.get(clave);
                if (existente) {
                    existente.cantidad += Number(d.cantidad) || 0;
                } else {
                    grupos.set(clave, { d, nuevo, cantidad: Number(d.cantidad) || 0 });
                }
            });
            return Array.from(grupos.values());
        }

        function buildCard(p, esNuevo = false) {
            let sinceMs = Date.now();
            if (p.fechaCreacion) {
                if (Array.isArray(p.fechaCreacion)) {
                    const a = p.fechaCreacion;
                    sinceMs = new Date(a[0], a[1] - 1, a[2], a[3] || 0, a[4] || 0, a[5] || 0).getTime();
                } else {
                    sinceMs = new Date(p.fechaCreacion).getTime() || Date.now();
                }
            }
            const esLlevar = p.tipo === 'LLEVAR';
            const lbl = etiquetaPedido(p);
            const tipoClass = esLlevar ? 'ct-ll' : 'ct-mesa';
            const tipoLbl = esLlevar ? LLEVAR.toUpperCase() : MESA.toUpperCase();

            const itemsHtml = agruparDetalles(p).map(({ d, nuevo, cantidad }) => {
                const sopaLine = d.acompananteSopa
                    ? `<div class="oc-sopa-row"><span class="oc-sopa">➕ con ${escapeHtml(d.acompananteSopa.nombre)}</span></div>`
                    : '';

                const presLine = d.presentacion
                    ? ` <span class="oc-pres">${escapeHtml(d.presentacion.nombre)}</span>`
                    : '';

                return `
                    <div class="oc-row">
                        <span class="oc-qty">${escapeHtml(String(cantidad))}×</span>${nuevo ? '<span class="oc-nuevo">NUEVO</span>' : ''}
                        <span class="oc-name">${escapeHtml(d.plato?.nombre || 'Plato')}${presLine}</span>
                        ${d.notas ? `<span class="oc-nota">${escapeHtml(d.notas)}</span>` : ''}
                    </div>
                    ${sopaLine}`;
            }).join('');

            const obsHtml = p.observaciones ? `<div class="oc-obs">📝 ${escapeHtml(p.observaciones)}</div>` : '';

            const btnHtml = p.estado === 'PENDIENTE'
                ? `<button type="button" class="abtn abtn-prep" onclick="cambiar(${p.id},'EN_PREPARACION')">Iniciar preparación</button>`
                : p.estado === 'EN_PREPARACION'
                    ? `<button type="button" class="abtn abtn-list" onclick="cambiar(${p.id},'LISTO')">Marcar como listo</button>`
                    : `<div class="oc-listo">Listo para entregar</div>`;

            const div = document.createElement('div');
            div.className = 'ocard' + (esNuevo ? ' flash' : '');
            div.id = 'oc-' + p.id;
            div.innerHTML = `
                <div class="ochead">
                    <div class="oc-id">
                        <span class="oc-mesa">${escapeHtml(lbl)}</span>
                        <span class="oc-tipo ${tipoClass}">${escapeHtml(tipoLbl)}</span>
                    </div>
                    <span class="oc-timer ok" data-since="${sinceMs}">00:00</span>
                </div>
                <div class="oc-items">${itemsHtml}</div>
                ${obsHtml}
                <div class="oc-action">${btnHtml}</div>`;
            return div;
        }

        function place(p, esNuevo = false) {
            const old = document.getElementById('oc-' + p.id);
            if (old) old.remove();
            PEDIDOS[p.id] = p;

            const bodyId = 'body-' + p.estado;
            const body = document.getElementById(bodyId);
            if (!body) return;

            body.querySelectorAll('.col-empty').forEach(e => e.remove());
            const newCard = buildCard(p, esNuevo);
            const pSince = parseInt(newCard.querySelector('.oc-timer').dataset.since);
            const cards = Array.from(body.querySelectorAll('.ocard'));
            let inserted = false;
            for (let i = 0; i < cards.length; i++) {
                const cSince = parseInt(cards[i].querySelector('.oc-timer').dataset.since);
                if (pSince < cSince) { body.insertBefore(newCard, cards[i]); inserted = true; break; }
            }
            if (!inserted) body.appendChild(newCard);
            updCounts();

        }

        function quitarPedido(id) {
            document.getElementById('oc-' + id)?.remove();
            delete PEDIDOS[id];
            updCounts();
        }

        function confirmarCambio(id, estado) {
            const p = PEDIDOS[id];
            if (!p) return Promise.resolve(true);
            const lbl = etiquetaPedido(p);
            const items = agruparDetalles(p).map(({ d, nuevo, cantidad }) => ({
                nombre: cantidad + '× ' + (d.plato?.nombre || 'Plato'),
                detalle: [d.presentacion?.nombre, d.acompananteSopa?.nombre, d.notas, nuevo ? 'Nuevo' : '']
                    .filter(Boolean).join(' · ')
            }));
            const iniciar = estado === 'EN_PREPARACION';
            return confirmAction('Pedido de ' + lbl, {
                titulo: iniciar ? '¿Iniciar preparación?' : '¿Marcar como listo?',
                resumen: [
                    { etiqueta: 'Pedido', valor: lbl },
                    { etiqueta: 'Estado', valor: (ESTADOS[p.estado] || p.estado) + ' → ' + (ESTADOS[estado] || estado) }
                ],
                items,
                aceptar: iniciar ? 'Iniciar' : 'Marcar listo',
                cancelar: 'Cancelar'
            });
        }

        async function cambiar(id, estado) {
            if (confirmando) return;
            confirmando = true;
            let ok = false;
            try {
                ok = await confirmarCambio(id, estado);
            } finally {
                confirmando = false;
            }
            if (!ok) return;
            const btn = document.querySelector(`#oc-${id} .abtn`);
            if (btn) { btn.disabled = true; btn.textContent = 'Procesando...'; }
            try {
                const r = await secureFetch(`/api/pedidos/${id}/estado?estado=${estado}`, { method: 'PUT' });
                if (!r.ok) throw await apiError(r);
                place(await r.json());
            } catch (e) {
                showNotice(e.message);
                if (btn) { btn.disabled = false; btn.textContent = 'Reintentar'; }
            }
        }

        function setCnt(id, valor) {
            const el = document.getElementById(id);
            const texto = String(valor);
            if (el.textContent === texto) return;
            el.textContent = texto;
            el.classList.remove('cnt-bump');
            void el.offsetWidth;
            el.classList.add('cnt-bump');
        }

        function updCounts() {
            const pend = document.getElementById('body-PENDIENTE').querySelectorAll('.ocard').length;
            const prep = document.getElementById('body-EN_PREPARACION').querySelectorAll('.ocard').length;
            const list = document.getElementById('body-LISTO').querySelectorAll('.ocard').length;
            ['cnt-p', 'hcnt-p'].forEach(id => setCnt(id, pend));
            ['cnt-r', 'hcnt-r'].forEach(id => setCnt(id, prep));
            ['cnt-l', 'hcnt-l'].forEach(id => setCnt(id, list));
            [ ['body-PENDIENTE', 'Sin pedidos pendientes'],
            ['body-EN_PREPARACION', 'Ninguno en preparación'],
            ['body-LISTO', 'Ninguno listo aún']].forEach(([bid, msg]) => {
                const b = document.getElementById(bid);
                if (!b.querySelector('.ocard') && !b.querySelector('.col-empty')) {
                    const d = document.createElement('div'); d.className = 'col-empty'; d.textContent = msg; b.appendChild(d);
                }
            });
        }

        let alertTimer = null;
        function showAlert(msg) {
            document.getElementById('abar-txt').textContent = msg;
            document.getElementById('abar').classList.add('show');
            clearTimeout(alertTimer);
            alertTimer = setTimeout(closeAlert, 5500);
            beep();
        }
        function closeAlert() {
            clearTimeout(alertTimer);
            document.getElementById('abar').classList.remove('show');
        }

        let audioCtx = null;

        function contextoAudio() {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            if (!audioCtx || audioCtx.state === 'closed') audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        ['pointerdown', 'keydown'].forEach(evento =>
            document.addEventListener(evento, () => contextoAudio(), { once: true, passive: true }));

        function beep() {
            try {
                const c = contextoAudio();
                if (!c) return;
                [ [880, .07], [660, .15], [880, .25] ].forEach(([f, t]) => {
                    const o = c.createOscillator(), g = c.createGain();
                    o.connect(g); g.connect(c.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(.2, c.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t + .14);
                    o.start(c.currentTime + t); o.stop(c.currentTime + t + .16);
                    o.onended = () => { o.disconnect(); g.disconnect(); };
                });
            } catch (e) {
                audioCtx = null;
            }
        }

        loadPedidos();
        setInterval(loadPedidos, 30000);

        function connectWs() {
          try {
            const sock = new SockJS('/ws');
            const stomp = Stomp.over(sock);
            stomp.debug = null;
            stomp.connect({}, () => {
                loadPedidos();
                stomp.subscribe('/topic/cocina', async (msg) => {
                    const n = JSON.parse(msg.body);
                    if (n.tipo === 'NUEVO_PEDIDO' || n.tipo === 'ITEMS_AGREGADOS'
                            || (n.tipo === 'ACTUALIZACION_ESTADO' && n.estado !== 'ENTREGADO')) {
                        try {
                            const r = await secureFetch('/api/pedidos/' + n.pedidoId);
                            if (!r.ok) throw await apiError(r);
                            const p = await r.json();
                            place(p, n.tipo === 'NUEVO_PEDIDO' || n.tipo === 'ITEMS_AGREGADOS');
                            if (n.tipo !== 'ACTUALIZACION_ESTADO') {
                                showAlert((n.tipo === 'ITEMS_AGREGADOS' ? 'Extras — ' : 'Nuevo pedido — ') + etiquetaPedido(p));
                            }
                        } catch (e) { console.error('fetch pedido:', e); showNotice(e.message); }
                    } else if (n.tipo === 'ACTUALIZACION_ESTADO' && n.estado === 'ENTREGADO') {
                        quitarPedido(n.pedidoId);
                    }
                });
            }, () => setTimeout(connectWs, 3000));
        } catch (e) { console.warn('WS no disponible'); setTimeout(connectWs, 3000); }
        }
        connectWs();

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (confirmando || document.querySelector('dialog[open]')) return;
            if (e.key.toLowerCase() === 'p') {
                const btn = document.querySelector('#body-PENDIENTE .abtn-prep');
                if (btn && !btn.disabled) btn.click();
            } else if (e.key.toLowerCase() === 'l') {
                const btn = document.querySelector('#body-EN_PREPARACION .abtn-list');
                if (btn && !btn.disabled) btn.click();
            }
        });
    </script>
</body>

</html>
