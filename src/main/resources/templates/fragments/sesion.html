<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="barra" th:if="${sesionUsuario != null}" class="sesion-menu">
    <button type="button" class="sm-toggle" aria-haspopup="true" aria-expanded="false"
            th:attr="aria-label=|Menú de sesión de ${sesionUsuario}|">
        <span class="sm-avatar" aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(sesionUsuario, 0, 1))}">U</span>
        <span class="sm-nombre" th:text="${sesionUsuario}">usuario</span>
        <span class="sm-flecha" aria-hidden="true">▾</span>
    </button>
    <div class="sm-panel" hidden>
        <div class="sm-cabecera">
            <div class="sm-usuario" th:text="${sesionUsuario}">usuario</div>
            <div class="sm-rol" th:text="${sesionRolEtiqueta}">Rol</div>
        </div>
        <nav class="sm-vistas" aria-label="Vistas disponibles" th:if="${#lists.size(sesionVistas) > 1}">
            <a th:each="v : ${sesionVistas}" th:href="@{${v.url}}" th:text="${v.label}"
               th:attr="aria-current=${v.url == sesionRuta ? 'page' : null}">Vista</a>
        </nav>
        <div class="sm-tema" role="group" aria-label="Apariencia">
            <span class="sm-tema-titulo" aria-hidden="true">Apariencia</span>
            <div class="sm-tema-opciones">
                <button type="button" data-tema="claro" aria-pressed="false">Claro</button>
                <button type="button" data-tema="oscuro" aria-pressed="false">Oscuro</button>
                <button type="button" data-tema="sistema" aria-pressed="false">Sistema</button>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="sm-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="sm-salir">Cerrar sesión</button>
        </form>
    </div>
</div>
</body>
</html>
