<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Ingresar — ${negocio.nombreNegocio}|">Ingresar</title>
    <th:block th:replace="~{fragments/head :: branding}"></th:block>
    <script defer th:src="@{/js/login.js}"></script>
</head>
<body class="login-page">
    <form class="login-card" th:action="@{/login}" method="post">
        <button type="button" class="tema-toggle" data-tema-alternar>Modo oscuro</button>
        <img th:src="${negocio.logoUrl}" th:alt="|Logo de ${negocio.nombreNegocio}|">
        <h1 class="brand-text" th:text="${negocio.nombreNegocio}">Gestión Comercial</h1>
        <p class="sub" th:text="${#strings.isEmpty(negocio.eslogan) ? 'Ingresa con tu usuario' : negocio.eslogan}">Ingresa con tu usuario</p>

        <div class="msg message-error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos</div>
        <div class="msg message-error" role="alert" th:if="${param.blocked}" th:text="|Demasiados intentos. Intenta nuevamente en ${param.blocked[0]} minutos|"></div>
        <div class="msg message-success" role="status" th:if="${param.logout}">Sesión cerrada correctamente</div>
        <div class="msg message-error" role="alert" th:if="${param.expirado}">Tu sesión fue cerrada porque un administrador cambió tu cuenta. Vuelve a ingresar.</div>

        <label for="username">Usuario</label>
        <input class="field" id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">Contraseña</label>
        <div class="password-wrap">
            <input class="field" id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle flat" id="password-toggle" aria-controls="password" aria-pressed="false">Mostrar</button>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="button-primary" type="submit">Ingresar</button>
    </form>
</body>
</html>
