<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Ekwe Iyawe</title>
    <link rel="icon" th:href="@{/img/logo.png?v=1}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; font-family: 'Nunito', system-ui, sans-serif; color: #fff;
            background: radial-gradient(circle at 30% 20%, #2a2233 0%, #121218 60%); }
        .card { width: 100%; max-width: 360px; padding: 32px 26px; border-radius: 22px; background: #1b1b24;
            border: 1px solid rgba(255,255,255,.07); box-shadow: 0 18px 50px rgba(0,0,0,.5); text-align: center; }
        .card img { width: 90px; border-radius: 16px; margin-bottom: 8px; }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 900; }
        .sub { color: rgba(255,255,255,.55); font-size: .9rem; margin: 4px 0 24px; }
        label { display: block; text-align: left; font-size: .78rem; font-weight: 800; letter-spacing: .06em;
            color: rgba(255,255,255,.6); margin: 14px 0 6px; }
        input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
            background: #121218; color: #fff; font: inherit; font-size: 1rem; outline: none; }
        input:focus { border-color: #F6B846; }
        button { width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
            background: #F6B846; color: #1b1b24; font: inherit; font-weight: 900; font-size: 1rem; }
        .msg { padding: 10px 12px; border-radius: 10px; font-size: .85rem; font-weight: 700; margin-bottom: 8px; }
        .msg.err { background: rgba(239,68,68,.15); color: #fca5a5; }
        .msg.ok  { background: rgba(34,197,94,.15); color: #86efac; }
    </style>
</head>
<body>
    <form class="card" th:action="@{/login}" method="post">
        <img th:src="@{/img/logo.png}" alt="Logo">
        <h1>Ekwe Iyawe</h1>
        <div class="sub">Ingresa con tu usuario</div>

        <div class="msg err" th:if="${param.error}">Usuario o contraseña incorrectos</div>
        <div class="msg ok" th:if="${param.logout}">Sesión cerrada correctamente</div>

        <label for="username">USUARIO</label>
        <input id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">CONTRASEÑA</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
